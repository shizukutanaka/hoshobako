<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoshobako — Warranty &amp; Expiry Ledger</title>
<style>
  :root { --fg:#1c2430; --mut:#5b6b7f; --line:#d8dee7; --bg:#f7f9fb; --card:#fff;
          --ok:#2e7d32; --warn:#b26a00; --bad:#c62828; --accent:#205c9e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", "Hiragino Sans", sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header .sub { color:var(--mut); font-size:13px; }
  header .sp { flex:1; }
  button, select, input, textarea { font:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  main { max-width:960px; margin:0 auto; padding:18px 16px 60px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px; }
  .stat b { font-size:18px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input[type=search] { flex:1; min-width:180px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
  .item img { width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .item .grow { flex:1; min-width:0; }
  .item h3 { margin:0 0 4px; font-size:16px; }
  .meta { color:var(--mut); font-size:13px; line-height:1.5; }
  .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .chip.ok { background:#e6f2e7; color:var(--ok); }
  .chip.expiring { background:#fdf0dc; color:var(--warn); }
  .chip.expired { background:#fbe4e4; color:var(--bad); }
  .chip.nodate { background:#eceff3; color:var(--mut); }
  .actions { display:flex; gap:6px; }
  dialog { border:1px solid var(--line); border-radius:14px; max-width:520px; width:calc(100% - 32px); padding:20px; }
  dialog::backdrop { background:rgba(20,30,45,.35); }
  form .row { margin-bottom:10px; }
  form label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; }
  form input, form select, form textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  .formbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .empty { color:var(--mut); text-align:center; padding:36px 0; }
  footer { color:var(--mut); font-size:12px; text-align:center; padding:0 16px 24px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<!-- HOSHOBAKO-APP -->
<header>
  <h1>Hoshobako</h1>
  <span class="sub" data-i18n="tagline">Warranty &amp; expiry ledger — local only, no account, no cloud.</span>
  <span class="sp"></span>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="search" id="q" data-i18n-ph="search_ph">
    <select id="fcat"></select>
    <button id="addBtn" class="primary" data-i18n="add">Add item</button>
    <button id="icsBtn" data-i18n="ics">Calendar (.ics)</button>
    <button id="csvBtn">CSV</button>
    <button id="jsonBtn" data-i18n="backup">Backup (.json)</button>
    <button id="importBtn" data-i18n="restore">Restore</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden data-i18n="empty">Nothing tracked yet. Add your first warranty or expiry date.</div>
</main>
<footer data-i18n="footer">Your data never leaves this computer. Hoshobako stores everything in one JSON file in your own data folder, and exports are yours to keep.</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle" style="margin-top:0"></h2>
    <input type="hidden" id="f_id">
    <div class="row"><label data-i18n="name">Name</label><input id="f_name" required></div>
    <div class="row"><label data-i18n="category">Category</label><select id="f_category"></select></div>
    <div class="row"><label data-i18n="store">Store / issuer</label><input id="f_store"></div>
    <div class="row"><label data-i18n="model">Model / serial</label><input id="f_model"></div>
    <div class="row"><label data-i18n="price">Price</label><input id="f_price"></div>
    <div class="row"><label data-i18n="purchased">Purchase date</label><input id="f_purchased" type="date"></div>
    <div class="row"><label data-i18n="months">Warranty length (months)</label><input id="f_months" type="number" min="0" step="1"></div>
    <div class="row"><label data-i18n="expires">Expiry date (overrides the two fields above)</label><input id="f_expires" type="date"></div>
    <div class="row"><label data-i18n="photo">Receipt photo</label><input id="f_photo" type="file" accept="image/*"></div>
    <div class="row"><label data-i18n="notes">Notes</label><textarea id="f_notes" rows="2"></textarea></div>
    <div class="formbtns">
      <button type="button" id="cancelBtn" data-i18n="cancel">Cancel</button>
      <button type="submit" class="primary" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<script>
const I18N = {
  en: { tagline:"Warranty & expiry ledger — local only, no account, no cloud.", add:"Add item", ics:"Calendar (.ics)",
    backup:"Backup (.json)", restore:"Restore", search_ph:"Search name, store, model…", empty:"Nothing tracked yet. Add your first warranty or expiry date.",
    footer:"Your data never leaves this computer. Hoshobako stores everything in one JSON file in your own data folder, and exports are yours to keep.",
    name:"Name", category:"Category", store:"Store / issuer", model:"Model / serial", price:"Price", purchased:"Purchase date",
    months:"Warranty length (months)", expires:"Expiry date (overrides the two fields above)", photo:"Receipt photo", notes:"Notes",
    cancel:"Cancel", save:"Save", edit:"Edit", del:"Delete", addTitle:"Add item", editTitle:"Edit item",
    total:"items", expired:"expired", soon:"within 30 days", ok:"covered",
    daysLeft:(d)=> d<0 ? `${-d} days overdue` : d===0 ? "expires today" : `${d} days left`,
    expiresOn:(d)=>"Expires "+d, purchasedOn:(d)=>"Bought "+d, allCats:"All categories",
    confirmDelete:"Delete this item?", confirmRestore:"Restore replaces the whole ledger with the backup file. Continue?",
    cats:{warranty:"Warranty", document:"Document", food:"Food / medicine", contract:"Contract", other:"Other"} },
  ja: { tagline:"保証と期限の台帳 — 端末内だけ、アカウントなし、クラウドなし。", add:"追加", ics:"カレンダー (.ics)",
    backup:"バックアップ (.json)", restore:"復元", search_ph:"名前・店・型番で検索…", empty:"まだ何も登録されていません。最初の保証や期限を追加しましょう。",
    footer:"データはこのコンピュータの外に出ません。すべてあなたのデータフォルダの JSON ファイル1つに保存され、書き出しはいつでも自由です。",
    name:"名前", category:"分類", store:"購入店 / 発行元", model:"型番 / シリアル", price:"価格", purchased:"購入日",
    months:"保証期間（か月）", expires:"期限日（上の2項目より優先）", photo:"レシート・保証書の写真", notes:"メモ",
    cancel:"キャンセル", save:"保存", edit:"編集", del:"削除", addTitle:"項目を追加", editTitle:"項目を編集",
    total:"件", expired:"期限切れ", soon:"30日以内", ok:"有効",
    daysLeft:(d)=> d<0 ? `${-d}日 超過` : d===0 ? "今日まで" : `あと${d}日`,
    expiresOn:(d)=>"期限 "+d, purchasedOn:(d)=>"購入 "+d, allCats:"すべての分類",
    confirmDelete:"この項目を削除しますか？", confirmRestore:"復元すると台帳全体がバックアップファイルで置き換わります。続けますか？",
    cats:{warranty:"保証", document:"書類", food:"食品・薬", contract:"契約", other:"その他"} }
};
let lang = localStorage.getItem("hoshobako-lang") || ((navigator.language||"en").startsWith("ja") ? "ja" : "en");
let items = [];
const $ = (id)=>document.getElementById(id);
const t = ()=>I18N[lang];

function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(t()[k]) el.textContent=t()[k]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t()[el.dataset.i18nPh]||""; });
  const cats = $("fcat"); cats.innerHTML = "";
  const all = document.createElement("option"); all.value=""; all.textContent=t().allCats; cats.appendChild(all);
  for (const c of Object.keys(t().cats)) { const o=document.createElement("option"); o.value=c; o.textContent=t().cats[c]; cats.appendChild(o); }
  const fc = $("f_category"); fc.innerHTML="";
  for (const c of Object.keys(t().cats)) { const o=document.createElement("option"); o.value=c; o.textContent=t().cats[c]; fc.appendChild(o); }
  $("lang").value = lang;
}

function render(){
  applyI18n();
  const q = $("q").value.trim().toLowerCase(), fc = $("fcat").value;
  const counts = {expired:0, expiring:0, ok:0};
  for (const it of items) counts[it.status] = (counts[it.status]||0)+1;
  $("stats").innerHTML = "";
  const mk = (label, val)=>{ const d=document.createElement("div"); d.className="stat"; d.innerHTML=""; const b=document.createElement("b"); b.textContent=val; d.appendChild(b); d.appendChild(document.createTextNode(" "+label)); return d; };
  $("stats").append(mk(t().total, items.length), mk(t().expired, counts.expired||0), mk(t().soon, counts.expiring||0), mk(t().ok, counts.ok||0));
  const list = $("list"); list.innerHTML = "";
  const shown = items.filter(it => (!fc || it.category===fc) && (!q || (it.name+" "+(it.store||"")+" "+(it.model||"")).toLowerCase().includes(q)));
  $("empty").hidden = shown.length>0;
  for (const it of shown) {
    const div = document.createElement("div"); div.className="item";
    if (it.photo) { const img=document.createElement("img"); img.src="/photos/"+encodeURIComponent(it.photo); img.alt=""; div.appendChild(img); }
    const grow = document.createElement("div"); grow.className="grow";
    const h = document.createElement("h3"); h.textContent = it.name; grow.appendChild(h);
    const meta = document.createElement("div"); meta.className="meta";
    const bits = [ t().cats[it.category]||it.category ];
    if (it.store) bits.push(it.store);
    if (it.model) bits.push(it.model);
    if (it.price) bits.push(it.price);
    if (it.purchased) bits.push(t().purchasedOn(it.purchased));
    if (it.expires_on) bits.push(t().expiresOn(it.expires_on));
    meta.textContent = bits.join(" · ");
    if (it.notes) { const n=document.createElement("div"); n.textContent=it.notes; meta.appendChild(n); }
    grow.appendChild(meta); div.appendChild(grow);
    const chip = document.createElement("span"); chip.className="chip "+it.status; chip.textContent = it.has_date ? t().daysLeft(it.days_left) : "—"; div.appendChild(chip);
    const act = document.createElement("div"); act.className="actions";
    const eb = document.createElement("button"); eb.textContent=t().edit; eb.onclick=()=>openForm(it); act.appendChild(eb);
    const db = document.createElement("button"); db.className="danger"; db.textContent=t().del; db.onclick=async()=>{ if(!confirm(t().confirmDelete)) return; await fetch("/api/items/"+it.id,{method:"DELETE"}); load(); };
    act.appendChild(db); div.appendChild(act);
    list.appendChild(div);
  }
}

async function load(){
  const r = await fetch("/api/items"); items = await r.json(); render();
}

function openForm(it){
  $("dlgTitle").textContent = it ? t().editTitle : t().addTitle;
  $("f_id").value = it ? it.id : "";
  $("f_name").value = it ? it.name : "";
  $("f_category").value = it ? it.category : "warranty";
  $("f_store").value = it ? (it.store||"") : "";
  $("f_model").value = it ? (it.model||"") : "";
  $("f_price").value = it ? (it.price||"") : "";
  $("f_purchased").value = it ? (it.purchased||"") : "";
  $("f_months").value = it && it.months ? it.months : "";
  $("f_expires").value = it ? (it.expires||"") : "";
  $("f_notes").value = it ? (it.notes||"") : "";
  $("f_photo").value = "";
  $("dlg").showModal();
}

$("form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const body = { id:$("f_id").value, name:$("f_name").value.trim(), category:$("f_category").value,
    store:$("f_store").value.trim(), model:$("f_model").value.trim(), price:$("f_price").value.trim(),
    purchased:$("f_purchased").value, months: parseInt($("f_months").value||"0",10), expires:$("f_expires").value,
    notes:$("f_notes").value.trim() };
  const method = body.id ? "PUT" : "POST";
  const url = body.id ? "/api/items/"+body.id : "/api/items";
  const r = await fetch(url, {method, headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  if (!r.ok) { alert(await r.text()); return; }
  const saved = await r.json();
  const photo = $("f_photo").files[0];
  if (photo) { const fd = new FormData(); fd.append("photo", photo); await fetch("/api/items/"+saved.id+"/photo", {method:"POST", body: fd}); }
  $("dlg").close(); load();
});
$("cancelBtn").onclick = ()=>$("dlg").close();
$("addBtn").onclick = ()=>openForm(null);
$("q").addEventListener("input", render);
$("fcat").addEventListener("change", render);
$("lang").addEventListener("change", ()=>{ lang=$("lang").value; localStorage.setItem("hoshobako-lang", lang); render(); });
$("icsBtn").onclick = ()=>location.href="/api/export.ics";
$("csvBtn").onclick = ()=>location.href="/api/export.csv";
$("jsonBtn").onclick = ()=>location.href="/api/export.json";
$("importBtn").onclick = ()=>$("importFile").click();
$("importFile").addEventListener("change", async ()=>{
  const f = $("importFile").files[0]; if (!f) return;
  if (!confirm(t().confirmRestore)) return;
  const r = await fetch("/api/import", {method:"POST", headers:{"Content-Type":"application/json"}, body: await f.text()});
  if (!r.ok) alert(await r.text()); load();
});
load();
</script>
</body>
</html>
